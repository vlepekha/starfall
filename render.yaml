# Blueprint для Render: «New → Blueprint → обрати цей репозиторій».
#
# Нічого вписувати руками не треба — і це не випадково.
#
# Природний спосіб був би задати ALLOWED_ORIGINS через `sync: false`,
# щоб Render запитав значення під час створення. Але він питає його
# РАНІШЕ, ніж сервіс існує, тобто коли адреса ще невідома — а саме
# адресу туди й треба вписати. Тому сервер бере власне походження
# з RENDER_EXTERNAL_URL, яке хостинг підставляє сам (див. server/src/config.ts).
services:
  - type: web
    name: starfall
    runtime: docker          # `env:` застаріле, актуальне — `runtime:`
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Render не пускає трафік на екземпляр, поки цей шлях не відповів.
    envVars:
      - key: NODE_ENV
        value: production
      # HOST саме 0.0.0.0: на 127.0.0.1 процес був би недосяжний
      # іззовні контейнера, і Render вважав би його мертвим.
      - key: HOST
        value: 0.0.0.0
      # Типовий порт Render — 10000. Задаємо явно, щоб не покладатися
      # на збіг зі значенням у Dockerfile.
      - key: PORT
        value: 10000
      - key: MAX_PLAYERS
        value: 128
      - key: MAX_CONNECTIONS_PER_IP
        value: 8
      - key: ROOM_CAPACITY
        value: 6
      # GIT_SHA не задаємо: Render збирає Dockerfile сам і build-arg не
      # передає, зате кладе в оточення RENDER_GIT_COMMIT — сервер бере
      # його як запасне джерело, і /health показує справжній комміт.
