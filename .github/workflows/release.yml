name: Release

# Реліз за тегом, а не за push у main.
#
# Так деплой лишається свідомою дією: кожна версія на хостингу
# відповідає тегу в репозиторії, і за SHA в /health завжди видно,
# що саме там працює.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Без цього дозволу push у GHCR повертає 403: GITHUB_TOKEN за
      # замовчуванням має лише читання.
      packages: write
    # Секрет піднімаємо в env на рівні задачі навмисно.
    #
    # У `if:` кроку контекст `secrets` недоступний — GitHub вважає
    # такий файл невалідним і не запускає робочий процес узагалі
    # (нуль задач, і в логах немає нічого). А от `env` задачі в `if`
    # кроку читається, тому перевірка «чи заданий секрет» робиться так.
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Вхід у GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги образу
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Зібрати й опублікувати
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Деплой на хостинг. Хостинг смикає свій webhook: він забирає
      # свіжий образ із GHCR і перезапускає контейнер.
      #
      # Крок умовний навмисно: без секрету робочий процес не падає,
      # а просто пропускає деплой — репозиторій лишається робочим
      # у форку й без доступу до хостингу.
      - name: Розгорнути на хостингу
        if: ${{ env.DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK_URL" \
            -H 'content-type: application/json' \
            -d "{\"image\":\"$REGISTRY/$IMAGE_NAME:$GITHUB_REF_NAME\",\"sha\":\"$GITHUB_SHA\"}"

      # Перевірка, що на живій адресі справді наша версія. Без неї
      # «задеплоїли» означало б лише «надіслали запит».
      - name: Перевірити живу адресу
        if: ${{ vars.PUBLIC_URL != '' }}
        run: |
          echo "чекаю на ${{ vars.PUBLIC_URL }}/health"
          for i in $(seq 1 60); do
            SHA=$(curl -sf "${{ vars.PUBLIC_URL }}/health" | jq -r .sha || echo "")
            if [ "$SHA" = "${{ github.sha }}" ]; then
              echo "розгорнуто: $SHA"
              echo "### Жива адреса оновлена: ${{ vars.PUBLIC_URL }}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "за 5 хвилин SHA на хостингу не збігся з ${{ github.sha }}"
          exit 1
