name: CI

on:
  push:
    branches: [main]
    tags: ["lab-*"]
  pull_request:

jobs:
  # Порядок кроків — від найдешевшого до найдорожчого: типи падають за
  # секунди, e2e піднімає два сервери й браузер. Немає сенсу ганяти
  # браузер, якщо не збираються типи.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Типи стираються при збірці, тому перевірка типів — окремий крок,
      # який нічого не збирає. Саме він ловить більшість помилок до запуску.
      - name: Перевірка типів
        run: npm run typecheck

      - name: Лінтер і формат
        run: npm run lint

      # Детермінізм, кодек, пули, зіткнення й перевірка, що shared
      # вантажиться без DOM.
      - name: Тести
        run: npm run test:coverage

      - name: Збірка клієнта
        run: npm run build

      # Тест детермінізму: симуляція має давати ті самі числа, що й до
      # переходу на TypeScript. Якщо щось поїхало — видно одразу.
      - name: Детермінізм симуляції
        run: npm run bench:physics

      # Вартість кроку при 128 кораблях. Не падає за порогом — просто
      # лишає число в логах, щоб регресію було видно в історії запусків.
      - name: Вартість кроку при 128 кораблях
        run: npm run bench:step -- 128

      - name: Встановити браузер для e2e
        run: npx playwright install --with-deps chromium

      # Два справжні клієнти в одному матчі: перевіряє зв'язку
      # клієнт-сервер цілком, чого не робить жоден юніт-тест.
      - name: E2E (два гравці)
        run: npm run e2e

      - name: Звіт e2e при падінні
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
