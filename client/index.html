<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starfall — мультиплеєрна аркада в реальному часі</title>
    <meta name="description" content="Космічна аркада в реальному часі: сервер рахує гру, клієнт передбачає рух." />
    <!-- PWA: без манифесту браузер не запропонує встановити гру. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070b14" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- iOS досі не читає манифест: для нього окремі мета-теги. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starfall" />
  </head>
  <body>
    <header class="bar">
      <h1 class="brand"><strong>Starfall</strong> <span class="tag">v1.0.0</span></h1>
      <div class="controls">
        <label>Режим <select id="mode"></select></label>
        <label>Блокування, мс <input id="block-ms" type="number" value="20" min="0" max="500" step="5" /></label>
        <button id="fire" type="button">Fire</button>
        <label class="controls__check"><input id="broken-this" type="checkbox" /> зламаний this</label>
        <button id="sound" type="button" hidden>Sound on</button>
        <button id="bench" type="button">Run benchmark</button>
        <button id="reset" type="button">Reset ship</button>
        <button id="leave" type="button">Leave room</button>
        <button id="install" type="button" hidden>Встановити</button>
      </div>
    </header>

    <main>
      <section id="lobby" class="lobby" hidden>
        <h2 class="lobby__title">Лобі</h2>
      </section>

      <section id="net-controls" class="netbar" hidden>
        <label>Затримка <input id="net-latency" type="range" min="0" max="300" step="10" value="0" /><output id="net-latency-out">0 мс</output></label>
        <label>Розкид <input id="net-jitter" type="range" min="0" max="100" step="5" value="0" /><output id="net-jitter-out">0 мс</output></label>
        <label>Втрати <input id="net-loss" type="range" min="0" max="30" step="1" value="0" /><output id="net-loss-out">0 %</output></label>
        <label class="netbar__check"><input id="net-predict" type="checkbox" checked /> передбачення</label>
        <label class="netbar__check"><input id="net-desync" type="checkbox" /> Math.random() у кроці</label>
        <button id="net-cheat" type="button">Спроба чіту</button>
      </section>

      <div class="play">
        <div class="stage"><canvas id="arena"></canvas></div>
        <aside class="side">
          <section id="netgraph" class="netgraph" hidden></section>
          <section id="chat" class="chat" hidden></section>
        </aside>
      </div>
      <button id="retry" class="retry" type="button" hidden>Retry завантаження</button>
      <div id="hud" class="hud"></div>
      <p id="note" class="note"></p>
      <ul id="log" class="log"></ul>
      <p class="help">Керування: <kbd>W</kbd>/<kbd>↑</kbd> тяга · <kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> поворот · <kbd>S</kbd>/<kbd>↓</kbd> гальмо · <kbd>Space</kbd> вогонь · <kbd>V</kbd> вектор швидкості. Краї арени загортаються.</p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
